# Local stack: PostgreSQL, Kafka (KRaft), the engine, and a fake actuator.
#   docker compose up -d --build        then   ./scripts/demo.sh
# Optional tracing:  docker compose --profile tracing up -d   (Jaeger UI http://localhost:16686)
name: notification-engine

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notif
      POSTGRES_USER: notif
      POSTGRES_PASSWORD: notif
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=200", "-c", "wal_compression=on",
              "-c", "autovacuum_naptime=10s", "-c", "random_page_cost=1.1"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif -d notif"]
      interval: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in signals.in:12 notification.results:12 notifications.out:12 notifications.dlq:3; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $${t%%:*} --partitions $${t##*:} --replication-factor 1
        done
    restart: "no"

  engine:
    build: .
    image: notification-engine:local
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notif
      DB_USER: notif
      DB_PASSWORD: notif
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # default (prod) profile: every role; a subset would be e.g. QUARKUS_PROFILE: timers,relay
      # local demo only: no OIDC provider in the stack
      NOTIFICATIONS_API_AUTH_ENABLED: "false"
      API_AUTH_POLICY: permit
      LOG_JSON: "true"
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /q/health/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      retries: 40

  fake-actuator:
    image: notification-engine:local
    depends_on:
      engine: {condition: service_healthy}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notif
      DB_USER: notif
      DB_PASSWORD: notif
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_PROFILE: fake-actuator
      NOTIFICATIONS_FAKE_ACTUATOR_FAILURE_RATE: "0.3"
      NOTIFICATIONS_API_AUTH_ENABLED: "false"
      API_AUTH_POLICY: permit
      LOG_JSON: "true"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["tracing"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4317:4317"]
