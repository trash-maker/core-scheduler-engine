# =====================================================================================
# Signal-driven notification engine - service configuration
# Every value can be overridden by env vars (e.g. NOTIFICATIONS_ROLES=timers,relay).
# =====================================================================================
quarkus.application.name=notification-engine

# ---- roles of this instance: one deployable, roles chosen with Quarkus profiles ----
# Default (prod), dev and test run every role. Run a subset with QUARKUS_PROFILE, e.g. QUARKUS_PROFILE=timers,relay
# (do not add prod then: it enables everything). An explicit NOTIFICATIONS_ROLE_X=true|false always wins.
notifications.role.ingest=false
notifications.role.timers=false
notifications.role.relay=false
notifications.role.results=false
notifications.role.api=false
notifications.role.fake-actuator=false
%prod.notifications.role.ingest=true
%prod.notifications.role.timers=true
%prod.notifications.role.relay=true
%prod.notifications.role.results=true
%prod.notifications.role.api=true
%dev.notifications.role.ingest=true
%dev.notifications.role.timers=true
%dev.notifications.role.relay=true
%dev.notifications.role.results=true
%dev.notifications.role.api=true
%test.notifications.role.ingest=true
%test.notifications.role.timers=true
%test.notifications.role.relay=true
%test.notifications.role.results=true
%test.notifications.role.api=true
%ingest.notifications.role.ingest=true
%timers.notifications.role.timers=true
%relay.notifications.role.relay=true
%results.notifications.role.results=true
%api.notifications.role.api=true
%fake-actuator.notifications.role.fake-actuator=true

# ---- topics (names live in config only, never in rules) ----
notifications.topics.signals=signals.in
notifications.topics.results=notification.results
notifications.topics.out=notifications.out
notifications.topics.dlq=notifications.dlq

# ---- signals ----
notifications.signals.store-unreferenced-signals=false
#notifications.signals.default-max-age=P7D
#notifications.actions.allow-list=SEND_EMAIL,SEND_SMS,PUSH

# ---- timers / relay ----
notifications.timers.workers=2
notifications.timers.batch-size=200
notifications.timers.max-failures=5
notifications.timers.failure-backoff=PT1S
notifications.timers.idle-min=PT0.1S
notifications.timers.idle-max=PT0.5S
notifications.timers.sweep-page-size=500
notifications.relay.workers=1
notifications.relay.batch-size=500
notifications.rules.refresh-interval=2s

# ---- retention ----
notifications.retention.terminal-notifications=P30D
notifications.retention.dedup=P7D
notifications.retention.inbox=P7D
notifications.retention.partitions-ahead=3
notifications.retention.interval=1h

# ---- PostgreSQL (source of truth); plain JDBC, transactions managed by the engine ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:notif}
quarkus.datasource.password=${DB_PASSWORD:notif}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/notif}
quarkus.datasource.jdbc.min-size=4
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:40}
quarkus.datasource.jdbc.transactions=enabled
quarkus.transaction-manager.default-transaction-timeout=PT60S
quarkus.datasource.jdbc.additional-jdbc-properties.reWriteBatchedInserts=true
quarkus.datasource.devservices.enabled=false
quarkus.flyway.migrate-at-start=true

# ---- Kafka ----
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false
quarkus.messaging.kafka.serializer-autodetection.enabled=false

mp.messaging.incoming.signals-in.enabled=${notifications.role.ingest}
mp.messaging.incoming.signals-in.connector=smallrye-kafka
mp.messaging.incoming.signals-in.topic=${notifications.topics.signals}
mp.messaging.incoming.signals-in.group.id=notification-engine-signals
mp.messaging.incoming.signals-in.batch=true
mp.messaging.incoming.signals-in.max.poll.records=500
mp.messaging.incoming.signals-in.partitions=${notifications.ingest.consumers:2}
mp.messaging.incoming.signals-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.signals-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.signals-in.auto.offset.reset=earliest
mp.messaging.incoming.signals-in.commit-strategy=throttled
mp.messaging.incoming.signals-in.failure-strategy=fail

mp.messaging.incoming.results-in.enabled=${notifications.role.results}
mp.messaging.incoming.results-in.connector=smallrye-kafka
mp.messaging.incoming.results-in.topic=${notifications.topics.results}
mp.messaging.incoming.results-in.group.id=notification-engine-results
mp.messaging.incoming.results-in.batch=true
mp.messaging.incoming.results-in.max.poll.records=500
mp.messaging.incoming.results-in.partitions=${notifications.results.consumers:2}
mp.messaging.incoming.results-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.results-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.results-in.auto.offset.reset=earliest
mp.messaging.incoming.results-in.commit-strategy=throttled
mp.messaging.incoming.results-in.failure-strategy=fail

# outbox relay -> notifications.out / notifications.dlq (topic per record); idempotent producer, acks=all.
# Trace context is carried by the outbox row, so connector tracing is off for this channel.
mp.messaging.outgoing.relay-out.enabled=${notifications.role.relay}
mp.messaging.outgoing.relay-out.connector=smallrye-kafka
mp.messaging.outgoing.relay-out.topic=${notifications.topics.out}
mp.messaging.outgoing.relay-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.relay-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.relay-out.enable.idempotence=true
mp.messaging.outgoing.relay-out.acks=all
mp.messaging.outgoing.relay-out.linger.ms=5
mp.messaging.outgoing.relay-out.compression.type=lz4
mp.messaging.outgoing.relay-out.request.timeout.ms=15000
mp.messaging.outgoing.relay-out.delivery.timeout.ms=25000
mp.messaging.outgoing.relay-out.tracing-enabled=false

# fake actuator (role fake-actuator, demos only): own consumer group on notifications.out
mp.messaging.incoming.fake-actuator-in.enabled=${notifications.role.fake-actuator}
mp.messaging.incoming.fake-actuator-in.connector=smallrye-kafka
mp.messaging.incoming.fake-actuator-in.topic=${notifications.topics.out}
mp.messaging.incoming.fake-actuator-in.group.id=fake-actuator
mp.messaging.incoming.fake-actuator-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.fake-actuator-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.fake-actuator-in.auto.offset.reset=earliest
mp.messaging.outgoing.fake-results-out.enabled=${notifications.role.fake-actuator}
mp.messaging.outgoing.fake-results-out.connector=smallrye-kafka
mp.messaging.outgoing.fake-results-out.topic=${notifications.topics.results}
mp.messaging.outgoing.fake-results-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.fake-results-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---- API security: OIDC / JWT bearer; roles from the 'groups' claim: admin or tenant:<tenantId> ----
notifications.api.auth-enabled=true
quarkus.oidc.tenant-enabled=${notifications.api.auth-enabled}
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/notifications}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:notification-engine}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=${OIDC_ROLE_CLAIM:groups}
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=${API_AUTH_POLICY:authenticated}

# ---- OpenAPI ----
quarkus.smallrye-openapi.info-title=Notification engine API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=jwt
quarkus.smallrye-openapi.store-schema-directory=docs/openapi
quarkus.swagger-ui.always-include=true

# ---- observability ----
quarkus.log.console.json.enabled=${LOG_JSON:true}
quarkus.log.category."trash_maker".level=INFO
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.micrometer.binder.http-server.match-patterns=/api/v1/tenants/[^/]+/notifications/[^/]+=/api/v1/tenants/{tenant}/notifications/{id}

quarkus.shutdown.timeout=30s
quarkus.virtual-threads.enabled=true

# ---- profiles ----
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.notifications.timers.idle-max=PT0.2S
%test.notifications.retention.interval=24h
